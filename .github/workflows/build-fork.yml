name: Build Fork APK

on:
  push:
    branches:
      - dev
    paths:
      - 'src/store/actions/manager.tsx'
      - 'src/pages/login/*.tsx'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build React web app
        run: |
          yarn build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Package web build
        run: |
          cd build
          zip -r ../koodo-reader-web.zip .
          cd ..

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: koodo-reader-web.zip

  build-apk:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build React web app
        run: |
          yarn build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with electron-builder
        run: |
          npx electron-builder --config.android.target[0].target=apk --config.android.target[0].arch[0]=arm64-v8a --android --publish=never 2>&1 || true
          # Also try with config flag
          npx electron-builder --config android.apk --arm64 --publish=never 2>&1 || true
          # Fallback: try direct APK build
          npx electron-builder --android --arm64 --publish=never 2>&1 || true
        env:
          USE_HARD_LINKS: false

      - name: Find APK files
        run: |
          echo "=== Searching for APKs ==="
          find /home/runner -name "*.apk" 2>/dev/null | head -20
          find /home/runner/work -name "*.apk" 2>/dev/null | head -20
          find . -name "*.apk" 2>/dev/null | head -20
          echo "=== Searching dist ==="
          ls -la dist/ 2>/dev/null || echo "no dist dir"
          ls -la release/ 2>/dev/null || echo "no release dir"

      - name: Generate tag
        id: tag
        run: |
          echo "tag=v$(date -d '8 hour' -u +3.%y.%m%d%H%M)-fork" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Koodo Reader Fork ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Koodo Reader Fork (No Login + Pro Unlocked)

            Fork from koodo-reader/koodo-reader with:
            - **Login removed** — auto-redirects to main page
            - **Pro features unlocked** — valid_until set to 2099

            ### Build Info
            - Version: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            koodo-reader-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
