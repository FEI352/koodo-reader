name: Build Fork Release

on:
  push:
    branches:
      - dev
    paths:
      - 'src/store/actions/manager.tsx'
      - 'src/pages/login/*.tsx'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build React web app
        run: |
          yarn build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Package build
        run: |
          cd build
          zip -r ../koodo-reader-fork-web.zip .
          cd ..

      - name: Generate tag
        id: tag
        run: |
          echo "tag=v$(date -d '8 hour' -u +3.%y.%m%d%H%M)-fork" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Koodo Reader Fork ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Koodo Reader Fork (No Login + Pro Unlocked)

            Fork from koodo-reader/koodo-reader with login removed and Pro features unlocked.

            ### Changes
            - **Login removed** — auto-redirects to main page
            - **Pro features unlocked** — valid_until forced to 2099

            ### Downloads
            - `koodo-reader-fork-web.zip` — 解压后浏览器打开 index.html 或部署到任意静态服务器。
            - Android: Chrome → 菜单 → 添加到主屏幕（PWA）
            - 桌面端请自行用 electron-builder 打包（`yarn build && npx electron-builder --linux`）

            > 官方 APK 来自单独的 React Native 项目，不是从这个 Electron 仓库构建的。
            > 如需原生 APK，需额外用 @capacitor/android 封装 web build。
          draft: false
          prerelease: false
          files: |
            koodo-reader-fork-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
